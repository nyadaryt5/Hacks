name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOOGLE_API_KEY: ""
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ultron-v6/requirements.lock
            ultron-v6/requirements-dev.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement ultron-v6/requirements.lock
          python -m pip install --requirement ultron-v6/requirements-dev.lock
          python -m pip install --no-deps --editable ./ultron-v6

      - name: Ruff
        run: python -m ruff check ultron-v6/ultron

      - name: Flake8
        run: python -m flake8 ultron-v6/ultron ultron-v6/ultron_v6.py tests

  typecheck:
    name: Type check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ultron-v6/requirements.lock
            ultron-v6/requirements-dev.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement ultron-v6/requirements.lock
          python -m pip install --requirement ultron-v6/requirements-dev.lock
          python -m pip install --no-deps --editable ./ultron-v6

      - name: Mypy
        run: python -m mypy ultron-v6/ultron ultron-v6/ultron_v6.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ultron-v6/requirements.lock
            ultron-v6/requirements-dev.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement ultron-v6/requirements.lock
          python -m pip install --requirement ultron-v6/requirements-dev.lock
          python -m pip install --no-deps --editable ./ultron-v6

      - name: Run offline tests with coverage gate
        run: python -m pytest --cov=ultron --cov-report=term-missing --cov-fail-under=85

  lockfile-check:
    name: Lockfile drift check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ultron-v6/requirements.lock
            ultron-v6/requirements-dev.lock
            ultron-v6/requirements-chroma.lock

      - name: Install pinned pip-tools
        # Pinned to match requirements-dev.lock so the compiled output
        # format is stable and drift detection is meaningful.
        run: python -m pip install --upgrade pip "pip-tools==7.6.1"

      - name: Verify committed lockfiles match the manifests
        run: make lockfile-check

  security:
    name: Security scans (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ultron-v6/requirements.lock
            ultron-v6/requirements-dev.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement ultron-v6/requirements.lock
          python -m pip install --requirement ultron-v6/requirements-dev.lock
          python -m pip install --no-deps --editable ./ultron-v6

      - name: Bandit
        run: python -m bandit -r ultron-v6/ultron -c pyproject.toml

      - name: Dependency audit
        run: python -m pip_audit --requirement ultron-v6/requirements.lock

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ultron-v6/requirements.lock
            ultron-v6/requirements-dev.lock

      - name: Install pinned build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement ultron-v6/requirements.lock
          python -m pip install --requirement ultron-v6/requirements-dev.lock

      - name: Build wheel and source distribution
        run: python -m build ultron-v6 --outdir dist
