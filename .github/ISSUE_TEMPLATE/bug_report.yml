name: Bug report
description: Report a problem with ULTRON v6
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of `ultron-v6 --version`"
      placeholder: "6.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.2"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce and observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant log output (redact API keys).
      render: text
