services:
  ultron:
    build:
      context: .
      dockerfile: ultron-v6/Dockerfile
    image: ultron-v6:latest
    ports:
      - "${ULTRON_PORT:-8080}:8080"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ULTRON_LOG_LEVEL: ${ULTRON_LOG_LEVEL:-INFO}
      ULTRON_BUDGET_MAX_TOKENS_PER_SESSION: ${ULTRON_BUDGET_MAX_TOKENS_PER_SESSION:-500000}
    volumes:
      - ultron-data:/data
    restart: unless-stopped

  # Runs the hash-pinned offline suite from the Dockerfile's test target.
  # Usage: docker compose run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: ultron-v6/Dockerfile
      target: test
    image: ultron-v6-test:latest
    command:
      - tests
      - --cov=ultron
      - --cov-report=term-missing
      - --cov-fail-under=85
    environment:
      GOOGLE_API_KEY: dummy-key-for-tests
      ULTRON_DB_URL: "sqlite:///:memory:"

volumes:
  ultron-data:
