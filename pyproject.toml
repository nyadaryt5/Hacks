[tool.pytest.ini_options]
testpaths = ["tests"]
# Network-dependent tests must opt in explicitly; the default suite is offline.
addopts = "-ra -m 'not network'"
markers = [
    "network: test requires an external network service and is opt-in",
]

[tool.coverage.run]
source = ["ultron"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["ultron-v6/ultron", "ultron-v6/ultron_v6.py"]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
exclude = ["build", "dist", ".venv", "*.egg-info"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["E501", "E203", "B904"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
