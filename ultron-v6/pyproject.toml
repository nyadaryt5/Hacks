[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-v6"
description = "Production-Grade Autonomous Pentest Framework"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nyadaryt5" }]
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "flake8>=6.0",
    "bandit>=1.7",
    "pip-audit>=2.6",
    "pip-tools>=7.0",
]
chroma = ["chromadb>=0.4.0"]
all = ["chromadb>=0.4.0"]

[project.scripts]
ultron-v6 = "ultron.cli:main"

[project.urls]
Homepage = "https://github.com/nyadaryt5/Hacks"
Repository = "https://github.com/nyadaryt5/Hacks"

[tool.setuptools]
py-modules = ["ultron_v6"]

[tool.setuptools.dynamic]
version = { attr = "ultron.__version__" }

[tool.setuptools.packages.find]
include = ["ultron", "ultron.*"]

[tool.setuptools.package-data]
ultron = ["py.typed"]
